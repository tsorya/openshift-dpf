apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-gtc-tenant-reader
  namespace: argus-gtc-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-gtc-tenant-reader
  namespace: argus-gtc-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-gtc-tenant-reader
  namespace: argus-gtc-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-gtc-tenant-reader
subjects:
  - kind: ServiceAccount
    name: argus-gtc-tenant-reader
    namespace: argus-gtc-demo
