# The AI agent runs in its own Kata VM on the tenant cluster. The local NAT
# runtime is reachable only through the sidecar's authenticated gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-gtc-agent
  namespace: argus-gtc-demo
  labels:
    app: argus-gtc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-gtc-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: argus-gtc-agent
      annotations:
        demo.argus.nvidia.com/agent-auth-hash: <ARGUS_GTC_AGENT_TOKEN_SHA256>
        demo.argus.nvidia.com/model-key-hash: <ARGUS_GTC_MODEL_API_KEY_SHA256>
    spec:
      runtimeClassName: <ARGUS_GTC_KATA_RUNTIME_CLASS>
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/<WORKER_ROLE>: ""
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: invisible-vm
              namespaces:
                - argus-gtc-demo
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nat-agent
          image: <ARGUS_GTC_AGENT_IMAGE>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          command: ["nat", "serve", "--config_file", "/app/workflow.yml", "--host", "127.0.0.1", "--port", "8000"]
          env:
            - name: ARGUS_GTC_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-gtc-agent-auth
                  key: token
            - name: ARGUS_GTC_MODEL_NAME
              value: <ARGUS_GTC_AGENT_MODEL_NAME>
            - name: ARGUS_GTC_MODEL_BASE_URL
              value: "<ARGUS_GTC_MODEL_BASE_URL>"
            - name: ARGUS_GTC_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: argus-gtc-model-auth
                  key: api-key
            - name: ARGUS_GTC_HOST_IP
              value: argus-gtc-canary.argus-gtc-demo.svc
            - name: ARGUS_GTC_DEMO_SERVER_URL
              value: <ARGUS_GTC_SERVER_URL>
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            exec:
              command: ["python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
            initialDelaySeconds: 15
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: gateway
          image: <ARGUS_GTC_AGENT_IMAGE>
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "argus_gtc_agent.gateway:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: gateway
              containerPort: 8001
          env:
            - name: ARGUS_GTC_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-gtc-agent-auth
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 2
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
