# Separate runc pod for the prompt-injection demo; the existing Kata workload
# remains unchanged and still has no in-guest security agent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-gtc-agent
  namespace: argus-gtc-demo
  labels:
    app: argus-gtc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-gtc-agent
  template:
    metadata:
      labels:
        app: argus-gtc-agent
      annotations:
        demo.argus.nvidia.com/agent-auth-hash: <ARGUS_GTC_AGENT_TOKEN_SHA256>
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/<WORKER_ROLE>: ""
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: invisible-vm
              namespaces:
                - argus-gtc-demo
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nat-agent
          image: <ARGUS_GTC_AGENT_IMAGE>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ARGUS_GTC_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-gtc-agent-auth
                  key: token
            - name: ARGUS_GTC_MODEL_NAME
              value: <ARGUS_GTC_AGENT_MODEL_NAME>
            - name: ARGUS_GTC_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: argus-gtc-agent
  namespace: argus-gtc-demo
  labels:
    app: argus-gtc-agent
spec:
  selector:
    app: argus-gtc-agent
  ports:
    - name: http
      port: 8081
      targetPort: http
