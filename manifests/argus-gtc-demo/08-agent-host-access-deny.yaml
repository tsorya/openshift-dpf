# Block the Kata agent pod from reaching any cluster node. Its bounded demo
# probe uses TCP/31999 so the ACL watcher can identify that attempt precisely.
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: argus-gtc-agent-host-access
  annotations:
    k8s.ovn.org/acl-logging: '{ "deny": "alert" }'
spec:
  priority: 0
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argus-gtc-demo
      podSelector:
        matchLabels:
          app: argus-gtc-agent
  egress:
    - name: deny-agent-to-cluster-nodes
      action: Deny
      to:
        - nodes: {}
