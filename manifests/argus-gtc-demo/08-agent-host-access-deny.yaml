# Allow the Kata agent to reach only the demo canary NodePort on cluster
# nodes, then deny every other node destination. ACL logging remains on the
# deny rule so a misconfiguration still produces policy evidence.
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: argus-gtc-agent-host-access
  annotations:
    k8s.ovn.org/acl-logging: '{ "deny": "alert" }'
spec:
  priority: 0
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argus-gtc-demo
      podSelector:
        matchLabels:
          app: argus-gtc-agent
  egress:
    - name: allow-agent-to-canary
      action: Allow
      to:
        - nodes: {}
      ports:
        - portNumber:
            protocol: TCP
            port: 31999
    - name: deny-agent-to-cluster-nodes
      action: Deny
      to:
        - nodes: {}
