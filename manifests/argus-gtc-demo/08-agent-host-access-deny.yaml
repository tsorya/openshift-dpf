# The only host-connect attempt from the AI agent targets TCP/31999. This
# cluster-scoped ANP denies that one flow only for the agent pod label.
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: argus-gtc-agent-host-access
  annotations:
    k8s.ovn.org/acl-logging: '{ "deny": "alert" }'
spec:
  priority: 0
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argus-gtc-demo
      podSelector:
        matchLabels:
          app: argus-gtc-agent
  egress:
    - name: deny-agent-demo-host-port
      action: Deny
      to:
        - nodes: {}
      ports:
        - portNumber:
            protocol: TCP
            port: 31999
