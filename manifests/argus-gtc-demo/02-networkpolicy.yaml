apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-workload-egress
  namespace: argus-gtc-demo
spec:
  podSelector:
    matchLabels:
      app: invisible-vm
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: scenario-sink
      ports:
        - protocol: TCP
          port: 4444
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
