apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-gtc-agent-egress
  namespace: argus-gtc-demo
spec:
  podSelector:
    matchLabels:
      app: argus-gtc-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: argus-gtc-demo
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: argus-gtc-demo
      ports:
        - protocol: TCP
          port: 8080
    # Direct OpenAI API access. The separate AdminNetworkPolicy still denies
    # any destination that is a cluster node.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        # OpenShift DNS Service port 53 forwards to the DNS pod's port 5353.
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
