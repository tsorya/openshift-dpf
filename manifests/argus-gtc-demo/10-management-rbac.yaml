apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-gtc-management-reader
  namespace: dpf-operator-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-gtc-demo-dpu-read
  namespace: dpf-operator-system
rules:
  - apiGroups: ["svc.dpu.nvidia.com"]
    resources: ["dpudeployments", "dpuserviceconfigurations"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-gtc-demo-dpu-read
  namespace: dpf-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-gtc-demo-dpu-read
subjects:
  - kind: ServiceAccount
    name: argus-gtc-management-reader
    namespace: dpf-operator-system
