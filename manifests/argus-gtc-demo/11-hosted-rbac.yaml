apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-gtc-hosted-reader
  namespace: dpf-operator-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-gtc-hosted-reader
  namespace: dpf-operator-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-gtc-hosted-reader
  namespace: dpf-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-gtc-hosted-reader
subjects:
  - kind: ServiceAccount
    name: argus-gtc-hosted-reader
    namespace: dpf-operator-system
