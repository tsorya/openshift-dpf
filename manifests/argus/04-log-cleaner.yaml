# Hosted-cluster DaemonSet: wipe Argus hostPath logs so DPU disk does not fill.
# Apply with the hosted/DOCA kubeconfig, not the management cluster.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: argus-log-cleaner
  namespace: dpf-operator-system
spec:
  selector:
    matchLabels:
      app: argus-log-cleaner
  template:
    metadata:
      labels:
        app: argus-log-cleaner
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: cleaner
          image: ghcr.io/k8snetworkplumbingwg/sriov-network-device-plugin:v3.11.0@sha256:7c5901727d4500f103f038c178b41dc6450afa6f324306c1973495c9a7c4f5a5
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                date
                rm -rf /var/log/doca_argus_activity_report/* /var/log/doca_argus/* 2>/dev/null
                sleep 300
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: activity-report
              mountPath: /var/log/doca_argus_activity_report
            - name: service-log
              mountPath: /var/log/doca_argus
      volumes:
        - name: activity-report
          hostPath:
            path: /var/log/doca_argus_activity_report
            type: DirectoryOrCreate
        - name: service-log
          hostPath:
            path: /var/log/doca_argus
            type: DirectoryOrCreate
