# Kata Containers on a Zero Trust tenant HostedCluster.
#
# The tenant has no MachineConfig/MachineConfigPool API, so the OpenShift route
# (OSC + KataConfig, see scripts/enable-kata.sh) cannot be used here. This is the
# upstream kata-deploy DaemonSet instead: it installs the kata binaries and CRI
# runtime handler directly on the node filesystem and never returns, so it must
# run as a DaemonSet and not as a Job.
#
# SELinux is the other gate: RHCOS has /opt -> var/opt, so the stock fcontext
# rules for /opt/*/bin never match and the extracted tree stays var_t, which the
# sandbox QEMU (container_kvm_t with MCS categories) cannot read. See
# scripts/enable-kata-tenant.sh, which applies the fcontext rules and relabels.
#
# Rendered with <KATA_VERSION> substituted by process_template().
---
apiVersion: v1
kind: Namespace
metadata:
  name: kata-deploy
  labels:
    app.kubernetes.io/managed-by: kata-deploy
    hypershift.openshift.io/zt-tenant: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kata-deploy-sa
  namespace: kata-deploy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kata-deploy-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get", "list", "patch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list"]
- apiGroups: ["nfd.k8s-sigs.io"]
  resources: ["nodefeaturerules"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kata-deploy-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kata-deploy-role
subjects:
- kind: ServiceAccount
  name: kata-deploy-sa
  namespace: kata-deploy
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-deploy
  namespace: kata-deploy
  labels:
    name: kata-deploy
spec:
  selector:
    matchLabels:
      name: kata-deploy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        name: kata-deploy
    spec:
      serviceAccountName: kata-deploy-sa
      # Installer mutates the host (CRI config, /opt/kata) and restarts the CRI
      # runtime; give SIGTERM cleanup time to finish.
      hostPID: true
      terminationGracePeriodSeconds: 600
      priorityClassName: system-node-critical
      tolerations:
      - operator: Exists
      containers:
      - name: kube-kata
        image: quay.io/kata-containers/kata-deploy:<KATA_VERSION>
        imagePullPolicy: IfNotPresent
        command:
        - /usr/bin/kata-deploy
        - install
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DAEMONSET_NAME
          value: kata-deploy
        - name: DEBUG
          value: "false"
        - name: SHIMS_X86_64
          value: qemu
        - name: HEALTH_PORT
          value: "8090"
        securityContext:
          privileged: true
        startupProbe:
          httpGet:
            path: /readyz
            port: 8090
          initialDelaySeconds: 1
          periodSeconds: 10
          failureThreshold: 60
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8090
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
        volumeMounts:
        - name: crio-conf
          mountPath: /etc/crio/
        - name: containerd-conf
          mountPath: /etc/containerd/
        - name: host
          mountPath: /host/
      volumes:
      - name: crio-conf
        hostPath:
          path: /etc/crio/
      - name: containerd-conf
        hostPath:
          path: /etc/containerd/
      - name: host
        hostPath:
          path: /
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
  labels:
    app.kubernetes.io/managed-by: kata-deploy
    kata-deploy/instance: "default"
  annotations:
    katacontainers.io/kata-version: "<KATA_VERSION>"
handler: kata-qemu
overhead:
  podFixed:
    memory: 160Mi
    cpu: 250m
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
---
# Alias used by the demo manifests (ARGUS_GTC_KATA_RUNTIME_CLASS=kata).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
  labels:
    app.kubernetes.io/managed-by: kata-deploy
    kata-deploy/instance: "default"
  annotations:
    katacontainers.io/kata-version: "<KATA_VERSION>"
handler: kata-qemu
overhead:
  podFixed:
    memory: 160Mi
    cpu: 250m
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
