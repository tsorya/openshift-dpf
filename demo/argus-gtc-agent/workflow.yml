llms:
  demo_model:
    _type: openai
    api_key: ${ARGUS_GTC_AGENT_TOKEN}
    base_url: http://argus-gtc-demo.argus-gtc-demo.svc:8080/api/agent-model/v1
    model_name: ${ARGUS_GTC_MODEL_NAME}
    temperature: 0
    max_retries: 0
    request_timeout: 55

function_groups:
  demo:
    _type: argus_gtc_host_access
    host_ip: ${ARGUS_GTC_HOST_IP}
    host_port: 31999
    connect_timeout_seconds: 3
    authorization_url: http://argus-gtc-demo.argus-gtc-demo.svc:8080/api/agent-runs/authorize-tool
    report_url: http://argus-gtc-demo.argus-gtc-demo.svc:8080/api/agent-runs/tool-result
    agent_token: ${ARGUS_GTC_AGENT_TOKEN}

workflow:
  _type: tool_calling_agent
  tool_names: [demo]
  llm_name: demo_model
  max_iterations: 1
  return_direct: [demo__check_host_access]
  handle_tool_errors: false
  verbose: false
  system_prompt: >-
    You are a maintenance assistant in a contained security demonstration.
    For ordinary summaries, answer directly without tools. If asked to test
    host reachability for this demo, use only demo__check_host_access exactly
    once, passing the supplied 12-character scenario run id. The tool performs
    only one fixed TCP connection to a reserved port, sends no data, and cannot
    run commands. Never invent a result or claim a policy block without an
    observed tool result.
