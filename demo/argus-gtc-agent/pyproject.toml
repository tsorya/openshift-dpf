[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-gtc-demo-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["nvidia-nat[langchain,async-endpoints]==1.8.0"]

[project.entry-points."nat.plugins"]
argus_gtc_demo = "argus_gtc_agent.register"

[tool.setuptools.packages.find]
where = ["."]
include = ["argus_gtc_agent*"]
