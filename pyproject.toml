[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openshift-dpf"
version = "1.0.0"
description = "OpenShift DPF (Data Processing Framework) deployment tool"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "OpenShift DPF Team"}
]
keywords = ["openshift", "dpf", "kubernetes", "nvidia", "dpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.0.0",
    "PyYAML>=6.0",
    "kubernetes>=28.1.0",
    "aicli",
    "requests>=2.31.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "types-PyYAML",
]
# VM management requires libvirt system libraries
# Install with: pip install openshift-dpf[vm]
# Requires: dnf install libvirt-devel (or apt install libvirt-dev)
vm = [
    "libvirt-python>=9.0.0",
]

[project.scripts]
dpf = "dpf.cli:main"

[project.urls]
Homepage = "https://github.com/openshift-dpf/openshift-dpf"
Repository = "https://github.com/openshift-dpf/openshift-dpf"
Documentation = "https://github.com/openshift-dpf/openshift-dpf/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["dpf*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["dpf"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
